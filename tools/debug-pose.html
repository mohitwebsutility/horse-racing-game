<!doctype html><html><body style="margin:0;background:#222"><canvas id="sheet"></canvas><div id="o" style="color:#fff;font:12px monospace"></div>
<script type="module">
import * as THREE from 'three';
import {AssetLoader} from '/src/game/AssetLoader.js';
import {AnimationController} from '/src/game/AnimationController.js';
const q=new URLSearchParams(location.search);
const view=q.get('view')||'side', state=q.get('speed')||'15';
const phases=(q.get('t')||'0,0.2,0.38,0.46,0.55,0.8').split(',').map(Number);
const al=await new AssetLoader().load();
const inst=al.createInstance({horseTex:1,jockeyMat:0,silks:'#e63946'});
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x88aacc);
scene.add(new THREE.HemisphereLight(0xffffff,0x445533,1.6)); const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,8,4);scene.add(dl);
scene.add(inst.root);
const ac=new AnimationController(inst,al.clips);
const W=320,H=300; const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H);
const cam=new THREE.PerspectiveCamera(q.get('fov')||24,W/H,0.1,100);
const v={side:[5,2.0,0],sideR:[-5,2.0,0.3],back:[-0.5,2.6,-5],front:[1,2,5],top:[3,5,-2]}[view];
cam.position.set(...v); cam.lookAt(0,1.7,0);
const sheet=document.getElementById('sheet'); sheet.width=W*phases.length; sheet.height=H; const c=sheet.getContext('2d');
ac.update(0.01,+state,+(q.get('steer')||0)); for(let i=0;i<30;i++) ac.update(1/60,+state,+(q.get('steer')||0));
phases.forEach((t,i)=>{ ac.debugSetHit(t); ac.update(0.0001,+state,+(q.get('steer')||0)); inst.root.updateMatrixWorld(true);
 r.render(scene,cam); c.drawImage(r.domElement,i*W,0); c.fillStyle='#fff';c.font='14px monospace';c.fillText('hit '+t,i*W+6,16);});
window.__done=true; document.getElementById('o').textContent='ok';
</script></body></html>
